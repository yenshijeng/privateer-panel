<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>銀河私掠者</title>
<style>
:root{--bg:#0b1020;--card:#141b30;--card2:#1b2442;--line:#27325a;--tx:#e6ebff;--dim:#8d98c4;--acc:#4fb3ff;--ok:#4fd18b;--warn:#ffb347;--bad:#ff6b6b;--top:56px;--tab:58px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
#app{max-width:520px;margin:0 auto;height:100%;position:relative}
#top{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:20;background:#0e1530;border-bottom:1px solid var(--line);padding:6px 8px;display:flex;flex-wrap:wrap;gap:4px 6px;font-size:12px}
.chip{background:var(--card2);border-radius:10px;padding:2px 8px;white-space:nowrap}
.chip b{color:var(--acc);font-weight:600}
.chip.warn{background:#5a3b12}.chip.warn b{color:#ffd08a}
.chip.bad{background:#5a1d1d}.chip.bad b{color:#ffb0b0}
#view{position:absolute;top:var(--top);bottom:calc(var(--tab) + env(safe-area-inset-bottom));left:0;right:0;overflow-y:auto;padding:10px 10px 64px}
#tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:20;display:flex;background:#0e1530;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;height:var(--tab);background:none;border:0;color:var(--dim);font-size:13px}
#tabs button{position:relative}
#tabs .dot{color:var(--bad);font-size:10px;position:absolute;top:4px;right:18%}
#tabs button.on{color:var(--acc);border-top:2px solid var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:15px}
.dim{color:var(--dim)} .sm{font-size:12px} .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.btn{background:var(--acc);color:#04101f;border:0;border-radius:9px;padding:9px 14px;font-size:14px;font-weight:600;min-height:40px}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.red{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.row{display:flex;align-items:center;gap:8px}.row.sb{justify-content:space-between}.grow{flex:1}
input,select,textarea{width:100%;background:#0e1530;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit}
textarea{min-height:110px;font-size:12px}
label{display:block;margin:8px 0 3px;font-size:13px;color:var(--dim)}
.seg{display:flex;gap:6px;margin:4px 0 8px}.seg button{flex:1}
.mis{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;background:var(--card2)}
.mis .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.opt{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;background:var(--card2)}
.opt.on{border-color:var(--acc);background:#1a3560}
.bar{height:8px;background:#0b1020;border-radius:5px;overflow:hidden;margin:2px 0 4px}.bar i{display:block;height:100%}
.tag{font-size:11px;border-radius:6px;padding:1px 6px;background:var(--card2);margin-left:4px}
.tag.p{background:#1d4d3a;color:#8dffc4}.tag.d{background:#5a3b12;color:#ffd08a}.tag.x{background:#5a1d1d;color:#ffb0b0}.tag.n{background:#27325a;color:#b9c3ee}
.mrow{border-bottom:1px solid var(--line);padding:8px 0}
.qty{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}.qty .n{min-width:36px;text-align:center;font-size:16px}
details{margin-bottom:10px}summary{padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-weight:600}
details[open]>summary{border-radius:12px 12px 0 0}details>div{border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:10px 12px;background:var(--card)}
#toast{position:fixed;left:50%;bottom:calc(var(--tab) + 14px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#243059;color:#fff;border-radius:10px;padding:8px 14px;font-size:13px;z-index:60;max-width:90%;display:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;display:none;align-items:center;justify-content:center;padding:20px}
#modal .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:420px;width:100%}
#battle{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:none}
#battle .in{max-width:520px;margin:0 auto;padding:8px 10px 90px}
.foe{border:2px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px;background:var(--card)}.foe.sel{border-color:var(--warn)}
.mv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mv button{padding:10px 4px}
.gun{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}.gun input{width:22px;height:22px;flex:none}.gun select{width:auto;padding:4px}
.gun.off{opacity:.45}
.eb{display:flex;align-items:center;gap:8px;margin:5px 0}.eb .l{width:40px}.eb .bar{flex:1;height:14px}.eb .b{width:36px;height:34px;padding:0;font-size:18px}
#bfoot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#0e1530;border-top:1px solid var(--line);z-index:55}
.logl{font-size:13px;padding:2px 0}.logl.hit{color:#ffd0a0}.logl.kill{color:var(--ok)}.logl.lose{color:var(--bad)}.logl.turn{color:var(--acc);margin-top:4px}
.sec-t{margin:12px 0 4px;font-weight:600;font-size:14px}
.row.wrap{flex-wrap:wrap}
svg text{font-family:inherit}
#mbtn{position:fixed;right:10px;bottom:calc(var(--tab) + 12px + env(safe-area-inset-bottom));z-index:55;width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:#141b30cc;color:var(--tx);font-size:18px;cursor:pointer}
#mbtn.on{border-color:var(--acc);color:var(--acc)}
#music{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab) + 58px + env(safe-area-inset-bottom));width:calc(100% - 20px);max-width:500px;z-index:54;border-radius:12px;overflow:hidden;box-shadow:0 4px 18px #0008;height:0;pointer-events:none}
#music.show{height:186px;pointer-events:auto}
#music .mtabs{display:flex;gap:6px;padding:4px 6px;background:#0e1424;height:36px;box-sizing:border-box}
#music .mtabs button{flex:1;border:1px solid var(--line);background:#141b30;color:var(--tx);border-radius:8px;font-size:13px;cursor:pointer}
#music .mtabs button.on{border-color:var(--acc);color:var(--acc)}
#music iframe{width:100%;height:150px;border:0;display:block}
</style>
</head>
<body>
<div id="app">
  <div id="top"></div>
  <div id="view"></div>
  <div id="tabs"></div>
</div>
<div id="battle"><div class="in"></div><div id="bfoot"></div></div>
<div id="toast"></div>
<button id="mbtn" title="背景音樂">🎵</button>
<div id="music"></div>
<div id="modal"><div class="box"></div></div>

<script src="bridge.js?v=20261126q"></script>
<script src="ui.js?v=20261126q"></script>
</body>
</html>
